[package]
name = "gh-pr-status"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gpui = "0.2.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
# The Dock badge; GPUI already builds these.
cocoa = "0.26"
objc = "0.2.7"
alacritty_terminal = "0.26.0"

[lints.rust]
# objc 0.2's macros, used for the Dock badge, test a `cargo-clippy` feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
